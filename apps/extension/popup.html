<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tala</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: white;
      color: #1f2937;
    }

    .container {
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .header button {
      padding: 6px 12px;
      font-size: 12px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      background: white;
      cursor: pointer;
    }

    .header button:hover {
      background: #f9fafb;
    }

    .content {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-group label {
      font-size: 12px;
      font-weight: 500;
      color: #6b7280;
    }

    .input-group input,
    .input-group textarea {
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      outline: none;
    }

    .input-group input:focus,
    .input-group textarea:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
    }

    .input-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .button-group {
      display: flex;
      gap: 8px;
    }

    .button {
      flex: 1;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      border: none;
    }

    .button-primary {
      background: #6366f1;
      color: white;
    }

    .button-primary:hover {
      background: #4f46e5;
    }

    .button-secondary {
      background: #f3f4f6;
      color: #374151;
      border: 1px solid #e5e7eb;
    }

    .button-secondary:hover {
      background: #e5e7eb;
    }

    .status {
      margin-top: 12px;
      padding: 8px 12px;
      font-size: 12px;
      border-radius: 6px;
      text-align: center;
    }

    .status-success {
      background: #d1fae5;
      color: #065f46;
    }

    .status-error {
      background: #fee2e2;
      color: #991b1b;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .auth-form input {
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      outline: none;
    }

    .auth-form input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
    }

    .auth-form button {
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      background: #6366f1;
      color: white;
    }

    .auth-form button:hover {
      background: #4f46e5;
    }

    .auth-link {
      text-align: center;
      font-size: 12px;
      color: #6b7280;
    }

    .auth-link a {
      color: #6366f1;
      text-decoration: none;
    }

    .auth-link a:hover {
      text-decoration: underline;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div id="app" class="container">
    <div class="loading">Loading...</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
