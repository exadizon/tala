<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tala Sanctuary</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap');

    :root {
      --bg: #f5f2eb;
      --panel: #ebe5d8;
      --paper: #fcfbf8;
      --ink: #1c201d;
      --muted: #5e665d;
      --faint: #d4cdc0;
      --accent: #a37230;
      --accent-soft: #f2e8d3;
      --accent-contrast: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121513;
        --panel: #191e1a;
        --paper: #212723;
        --ink: #f4f1ea;
        --muted: #a8b2a5;
        --faint: #323b34;
        --accent: #e5b869;
        --accent-soft: #352d1d;
        --accent-contrast: #141714;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 340px;
      min-height: 220px;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--faint);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-star {
      color: var(--accent);
      width: 16px;
      height: 16px;
    }

    .brand h1 {
      font-family: 'Newsreader', serif;
      font-style: italic;
      font-size: 18px;
      font-weight: 400;
      color: var(--ink);
      letter-spacing: -0.02em;
    }

    .signout-btn {
      padding: 4px 8px;
      font-size: 10px;
      font-family: 'DM Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: 1px solid var(--faint);
      border-radius: 6px;
      background: var(--paper);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .signout-btn:hover {
      border-color: var(--accent);
      color: var(--ink);
    }

    .content {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-group label {
      font-size: 10px;
      font-family: 'DM Mono', monospace;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .input-group input,
    .input-group textarea,
    .auth-form input {
      padding: 8px 10px;
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      border: 1px solid var(--faint);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .input-group input:focus,
    .input-group textarea:focus,
    .auth-form input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .input-group textarea {
      resize: none;
      min-height: 64px;
      font-family: 'Newsreader', serif;
      font-style: italic;
    }

    .button-group {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .button {
      flex: 1;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .button-primary {
      background: var(--accent);
      color: var(--accent-contrast);
      border: none;
      font-weight: 600;
    }

    .button-primary:hover {
      opacity: 0.95;
    }

    .button-secondary {
      background: var(--paper);
      color: var(--ink);
      border: 1px solid var(--faint);
    }

    .button-secondary:hover {
      border-color: var(--accent);
    }

    .status {
      margin-top: 8px;
      padding: 6px 10px;
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      border-radius: 6px;
      text-align: center;
      animation: fadeIn 0.2s ease;
    }

    .status-success {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-error {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .auth-form button {
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      border: none;
      background: var(--accent);
      color: var(--accent-contrast);
      transition: opacity 0.15s ease;
    }

    .auth-form button:hover {
      opacity: 0.95;
    }

    .auth-link {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    .auth-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .auth-link a:hover {
      text-decoration: underline;
    }

    .loading {
      text-align: center;
      padding: 24px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(2px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading">Opening Tala sanctuary...</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
